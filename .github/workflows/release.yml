name: Release

# A tag such as v0.2.1 builds, tests, signs (when SignPath is set up), and publishes a GitHub release.
# A manual run does the same steps, but creates no release. See RELEASING.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Never run two releases of the same ref at the same time.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write   # create the GitHub release
      actions: read     # SignPath reads the uploaded workflow artifact

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Select-Xml -Path Directory.Build.props -XPath '//Version').Node.InnerText
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne "v$version") {
            throw "Tag ${{ github.ref_name }} does not match <Version>$version</Version> in Directory.Build.props."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore BitShelter.slnx

      - name: Build
        run: dotnet build BitShelter.slnx -c Release --no-restore

      - name: Test
        run: dotnet test --solution BitShelter.slnx -c Release --no-build

      - name: Build installer
        run: dotnet build BitShelter.Setup -c Release

      - name: Upload unsigned MSI
        id: unsigned
        uses: actions/upload-artifact@v7
        with:
          name: BitShelter-msi-unsigned
          path: BitShelter.Setup/bin/x64/Release/*.msi
          if-no-files-found: error

      - name: Sign with SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
          parameters: |
            version: ${{ toJSON(steps.version.outputs.version) }}

      - name: Create GitHub release
        if: ${{ github.ref_type == 'tag' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $signed = Test-Path signed
          $folder = if ($signed) { 'signed' } else { 'BitShelter.Setup/bin/x64/Release' }
          $msi = Get-ChildItem $folder -Filter *.msi -Recurse | Select-Object -First 1
          $changelog = Get-Content CHANGELOG.md -Raw
          $section = [regex]::Match($changelog, "(?ms)^### \[$([regex]::Escape($env:VERSION))\][^\n]*\n(.*?)(?=^### \[|\z)")
          if (-not $section.Success) { throw "CHANGELOG.md has no section for $env:VERSION." }
          $notes = $section.Groups[1].Value.Trim()
          if (-not $signed) { $notes += "`n`nThis MSI is not code-signed, so Windows SmartScreen can show a warning." }
          Set-Content -Path release-notes.md -Value $notes
          gh release create "${{ github.ref_name }}" $msi.FullName --title "BitShelter $env:VERSION" --notes-file release-notes.md
